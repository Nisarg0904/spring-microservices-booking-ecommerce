#--------------------------------------
# 1. docker-compose -p microservice-comp3095-ecommerce -f docker-compose.yml up -d
#   - this command will start the container in detached mode (-d) without rebuilding the image (if they exist)
# 2. docker-compose -p microservice-comp3095-ecommerce -f docker-compose-single.yml up -d --build
#   - this command forces the rebuild of images, even if they already exist, before starting them.
#--------------------------------------------


version: '3.9'

services:

  product-service:
    image: product-service
    ports:
      - "8084:8084"
    build:
      context: ./product-service # directory where docker file is located
      dockerfile: ./Dockerfile   # specify dockerfile for use to build image
    container_name: product-service
    environment:
      SPRING_PROFILES_ACTIVE: docker # this tells Spring boots to use the "docker" profile, which could be configured
    depends_on:
      - mongodb
    networks:
      - spring

  # 2. Order Service
  order-service:
    image: order-service
    ports:
      - "8085:8085"
    build:
      context: ./order-service # directory where Dockerfile is located
      dockerfile: ./Dockerfile   # specify Dockerfile to build the image
    container_name: order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - postgres
    networks:
      - spring

  mongodb:
    image: mongo:latest # put the version which you want to use
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - ./data/mongo/products:/data/db
      - ./init/mongo/docker-entrypoint-initdb.d/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    #command: mongod --auth
    #command : unless-stopped
    networks:
      - spring

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_MONGODB_SERVER=mongodb


    container_name: mongo-expresss
    depends_on:
      - mongodb
    networks:
      - spring


  postgres:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - spring

    # 6. pgAdmin (UI for PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.ca
      PGADMIN_DEFAULT_PASSWORD: password
    depends_on:
      - postgres
    networks:
      - spring
volumes:
  mongo-db:
    driver: local
  postgres-data:
    driver: local

networks:
  spring:
    driver: bridge







