spring.application.name=booking-service
server.port=8088

booking-service.version=v1.0

#mongodb database properties
spring.data.mongodb.host=mongodb-booking
spring.data.mongodb.port=27017
spring.data.mongodb.database=booking-service
spring.data.mongodb.username=admin
spring.data.mongodb.password=password
spring.data.mongodb.authentication-database=admin

room.service.url=http://room-service:8086
user.service.url=http://user-service:8087
springdoc.swagger-ui.path=/swagger-ui

springdoc.api-docs.path=/api-docs